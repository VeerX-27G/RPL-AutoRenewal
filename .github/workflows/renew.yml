name: RPL Auto Renewal

on:
  # 12:00 A.M. in Regina (Saskatchewan does not observe daylight saving time) is 06:00 UTC.
  schedule:
    - cron: "0 6 * * *"
  # Lets you run it by hand from the Actions tab to test.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # library_renewal.py uses `lazy import`, which needs Python 3.15 or newer.
      # allow-prereleases lets this keep working if 3.15 is not yet a stable build on the runner.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          allow-prereleases: true
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Chrome and chromedriver come preinstalled on ubuntu-latest.
      # Selenium 4.6+ locates the matching driver automatically.
      - name: Run renewal script
        env:
          # Runner clocks are UTC. The script compares due dates against "today",
          # so make "today" the Regina date.
          TZ: America/Regina
          BARCODE: ${{ secrets.BARCODE }}
          PASSWORD: ${{ secrets.PASSWORD }}
          EMAIL: ${{ secrets.EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: python library_renewal.py