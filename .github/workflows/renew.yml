name: RPL Auto Renewal

on:
  # 00:17 in Regina (Saskatchewan does not observe daylight saving time) is 06:17 UTC.
  # The odd minute is deliberate: GitHub delays or drops scheduled runs at the top of the hour.
  schedule:
    - cron: "17 6 * * *"
  # Lets you run it by hand from the Actions tab to test.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Chrome and chromedriver come preinstalled on ubuntu-latest.
      # Selenium 4.6+ locates the matching driver automatically.
      - name: Run renewal script
        env:
          # The script works out the Regina date itself; TZ just keeps log timestamps in Regina time.
          TZ: America/Regina
          BARCODE: ${{ secrets.BARCODE }}
          PASSWORD: ${{ secrets.PASSWORD }}
          EMAIL: ${{ secrets.EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: python library_renewal.py